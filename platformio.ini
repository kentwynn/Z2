[env:z2]
platform = espressif32
board = z2_n16r8
framework = arduino
extra_scripts = pre:scripts/patch_websocket_timeout.py
monitor_speed = 115200
upload_speed = 115200
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
lib_deps =
	https://github.com/orji123/Irisoled.git#338ca7c591e2fb230f11dda03e3aea6ae6171e44
	gilmaimon/ArduinoWebsockets @ 0.5.4
	bblanchon/ArduinoJson @ ^7.4.2
	adafruit/Adafruit NeoPixel @ ^1.12.3
	adafruit/Adafruit SSD1306 @ ^2.5.12
	adafruit/Adafruit GFX Library @ ^1.12.1
	adafruit/Adafruit VEML7700 Library @ ^2.1.6
	pololu/VL53L0X @ ^1.3.1
	pololu/VL53L1X @ ^1.3.1
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/WebServer
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS
	symlink://${platformio.packages_dir}/framework-arduinoespressif32/libraries/DNSServer
